; ==========================================
; Polybar — squared workspaces + Nerd Font
; ==========================================

[colors]
yellow = #d4b876
bg = #1e2720
fg = #e0e8dc
fg-alt = #8a9584
blue = #7fb08a
blue-dim = #3a4a3e
red = #c97064

green = #a3be8c
[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 23
bottom = false
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = "FiraCode Nerd Font Mono:size=11;2"
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

modules-left = trinity i3
modules-center = window
modules-right = volume music-ctl systray date

; --- i3 workspaces as filled squares ---
; The trick: the label content is a Nerd Font glyph (U+F111, a filled circle)
; with padding on both sides. Because the glyph has full vertical extent,
; the background renders as a proper square. The digit is shown as a
; tooltip-style marker via the label prefix.

[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false
strip-wsnumbers = false

label-focused = %name%
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.blue}
label-focused-padding = 1
label-focused-margin = 0

label-unfocused = %name%
label-unfocused-foreground = ${colors.fg}
label-unfocused-background = ${colors.blue-dim}
label-unfocused-padding = 1
label-unfocused-margin = 0

label-visible = %name%
label-visible-foreground = ${colors.fg}
label-visible-background = ${colors.blue-dim}
label-visible-padding = 1
label-visible-margin = 0

label-urgent = %name%
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.red}
label-urgent-padding = 1
label-urgent-margin = 0
[module/date]
type = internal/date
interval = 1
time = "%I:%M %p"
date = "%Y-%m-%d"
label = %time%
label-foreground = ${colors.blue}

; ===== readable stat modules =====

; ===== merged, readable stat modules =====

[module/systray]
type = internal/tray
format = <tray>
tray-spacing = 8
tray-maxsize = 16
tray-padding = 2

[module/volume]
type = internal/pulseaudio
format-volume = <ramp-volume> <bar-volume> <label-volume>
format-muted = <label-muted>
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.blue}
bar-volume-width = 10
bar-volume-foreground-0 = ${colors.green}
bar-volume-foreground-1 = ${colors.green}
bar-volume-foreground-2 = ${colors.yellow}
bar-volume-foreground-3 = ${colors.red}
bar-volume-gradient = false
bar-volume-indicator = 
bar-volume-fill = ─
bar-volume-empty = ─
bar-volume-empty-foreground = ${colors.blue-dim}
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}
label-muted = muted
label-muted-foreground = ${colors.red}

[module/window]
type = custom/script
exec = ~/.config/polybar/scripts/window-title.sh
interval = 0.1
format = <label>
format-foreground = ${colors.fg}
format-padding = 1

[module/music-status]
type = custom/script
exec = ~/.config/polybar/scripts/player-status.sh
interval = 1
format = <label>
format-foreground = ${colors.fg}
click-left = ~/.config/polybar/scripts/player-ctl.sh toggle
click-right = ~/.config/polybar/scripts/player-ctl.sh stop

[module/music-ctl]
type = custom/script
exec = echo " 󰐊 "
interval = 86400
format = <label>
format-foreground = ${colors.blue}
click-left = ~/.config/polybar/scripts/playlist-picker.sh

[module/trinity]
type = custom/text
content = "Trinity"
content-foreground = ${colors.bg}
content-background = ${colors.blue}
content-padding = 1
content-margin = 0
click-left = rofi -show drun
