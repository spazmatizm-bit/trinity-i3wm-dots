# ==========================================
# Minimal, working Picom config
# ==========================================

backend = "glx";
vsync = true;

# Shadows
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.5;
shadow-offset-x = -8;
shadow-offset-y = -8;

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

# Transparency
inactive-opacity = 0.9;
inactive-dim = 0.1;

# Rounded corners
corner-radius = 0;

# Blur
# Per-app transparency (so blur is visible behind the window)
opacity-rule = [
  "95:class_g = 'kitty'",
  "90:class_g = 'Rofi'"
];

# wintypes
wintypes:
{
  dock = { shadow = false; };
  dnd = { shadow = false; };
};

blur:
{
  method = "dual_kawase";
  strength = 2;
};

rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3bar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

